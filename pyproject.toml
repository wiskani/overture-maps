[project]
name = "overture-maps"
version = "0.1.0"
description = "Load Overture Maps data into PostGIS and expose spatial query functions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30.0",
    "geoalchemy2>=0.15.0",
    "psycopg2-binary>=2.9.0",
    "pyarrow>=14.0.0",
    "pandas>=2.0.0",
    "shapely>=2.0.0",
    "pyyaml>=6.0",
    "overturemaps>=0.8.0",
    "click>=8.0",
]

[project.optional-dependencies]
load = [
    "overture-schema-system",
    "overture-schema-common",
    "overture-schema-addresses-theme",
    "overture-schema-places-theme",
    "overture-schema-divisions-theme",
    "overture-schema-transportation-theme",
]

[project.scripts]
overture-load           = "overture_maps.cli:load"
overture-nearby-addresses  = "overture_maps.cli:nearby_addresses"
overture-street-at-point   = "overture_maps.cli:street_at_point"
overture-nearby-places     = "overture_maps.cli:nearby_places"
overture-search-places     = "overture_maps.cli:search_places"
overture-streets-near-place = "overture_maps.cli:streets_near_place"
overture-search-streets    = "overture_maps.cli:search_streets"
overture-search-divisions  = "overture_maps.cli:search_divisions"
overture-streets-in-division = "overture_maps.cli:streets_in_division"
overture-health            = "overture_maps.cli:health"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/overture_maps"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88

[tool.uv.sources]
overture-schema-system = { git = "https://github.com/OvertureMaps/schema", subdirectory = "packages/overture-schema-system" }
overture-schema-common = { git = "https://github.com/OvertureMaps/schema", subdirectory = "packages/overture-schema-common" }
overture-schema-addresses-theme = { git = "https://github.com/OvertureMaps/schema", subdirectory = "packages/overture-schema-addresses-theme" }
overture-schema-places-theme = { git = "https://github.com/OvertureMaps/schema", subdirectory = "packages/overture-schema-places-theme" }
overture-schema-divisions-theme = { git = "https://github.com/OvertureMaps/schema", subdirectory = "packages/overture-schema-divisions-theme" }
overture-schema-transportation-theme = { git = "https://github.com/OvertureMaps/schema", subdirectory = "packages/overture-schema-transportation-theme" }

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pre-commit>=4.0",
    "overture-schema-system",
    "overture-schema-common",
    "overture-schema-addresses-theme",
    "overture-schema-places-theme",
    "overture-schema-divisions-theme",
    "overture-schema-transportation-theme",
]
